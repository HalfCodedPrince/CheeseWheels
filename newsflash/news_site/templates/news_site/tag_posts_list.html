
{% extends 'base.html' %}
{% load static %}

{% block css_files %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %} 


{% block content %}
    <h2>Posts with Tag: {{ tag.tag }}</h2>
    <ul>
        {% for post in posts %}
            <li><a href="{% url 'post-detail-page' post.slug %}">{{ post.title }}</a></li>
        {% empty %}
            <li>No posts found.</li>
        {% endfor %}
    </ul>
{% endblock %}
